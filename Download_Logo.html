<!DOCTYPE html>
<html>
<head>
    <title>Downloading Logo...</title>
</head>
<body>
<canvas id="canvas" width="512" height="512" style="display:none;"></canvas>
<script>
// We scale it up for better quality (512x512)
const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 120 120">
    <path fill="#FFFFFF" d="M60,4 A56,56 0 1,0 60.01,4 Z" />
    <path fill="#1B7A4D" d="M60,14 A46,46 0 1,0 60.01,14 Z" />
    <path fill="#F4D27A" d="M78,60 A20,20 0 1,1 58,40 A16,16 0 1,0 78,60 Z" />
    <path fill="#F4D27A" d="M84,42 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 Z" />
</svg>`;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const DOMURL = window.URL || window.webkitURL || window;

const img = new Image();
const svg = new Blob([svgString], {type: "image/svg+xml;charset=utf-8"});
const url = DOMURL.createObjectURL(svg);

img.onload = function() {
    ctx.drawImage(img, 0, 0);
    const png = canvas.toDataURL("image/png");
    
    // Trigger download
    const a = document.createElement("a");
    a.download = "BrightNest_Logo.png";
    a.href = png;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    DOMURL.revokeObjectURL(png);
    document.body.innerHTML = "<h2>PNG Image successfully downloaded! Check your Downloads folder.</h2><p>You can now close this tab.</p>";
};
img.src = url;
</script>
</body>
</html>
